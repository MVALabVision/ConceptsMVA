<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Concept not found — MVA Lab</title>
  <link rel="icon" href="/ConceptsMVA/assets/img/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --fg: #0f1720; --muted: #5d6b7a; --bg: #f4f6f9; --surface: #fff; --line: #d9e0e8; --accent: #0b5fd0; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e6ebf1; --muted: #93a0ae; --bg: #0b0f14; --surface: #121820; --line: #223040; --accent: #5aa2ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    .card { max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { margin: 0 0 20px; color: var(--muted); }
    code { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
    a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Concept not found · Không tìm thấy concept</h1>
    <p>This link does not match any published concept. It may have been removed, or the deployment may still be in progress.<br>
       Link này không khớp với concept nào đã xuất bản. Có thể concept đã bị xóa hoặc đang được triển khai.</p>
    <p><code id="path"></code></p>
    <a id="home" href="/">Back to the library · Về thư viện</a>
  </div>
  <script>
    (function () {
      document.getElementById('path').textContent = location.pathname;
      // Derive the site root: first path segment is the repository name on github.io project sites.
      var parts = location.pathname.split('/').filter(Boolean);
      var root = location.hostname.endsWith('github.io') && parts.length ? '/' + parts[0] + '/' : '/';
      document.getElementById('home').setAttribute('href', root);
    })();
  </script>
</body>
</html>
